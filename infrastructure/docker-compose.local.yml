services:
  redis:
    image: redis:7-alpine
    container_name: roomiesmart-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: roomiesmart-postgres
    environment:
      POSTGRES_DB: roomiesmart_db
      POSTGRES_USER: roomiesmart
      POSTGRES_PASSWORD: localpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: