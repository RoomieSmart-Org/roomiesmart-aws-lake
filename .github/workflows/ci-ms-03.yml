name: CI/CD - MS-03 Identity & Auth

on:
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'services/ms-03-identity-auth/**'
  push:
    branches: [ develop, main ]
    paths:
      - 'services/ms-03-identity-auth/**'

jobs:
  # Etapa 2: Integración Continua (Pruebas y Build)
  ci-build-and-test:
    name: Unit Tests & Maven Build
    runs-on: ubuntu-latest
    if: hashFiles('services/ms-03-identity-auth/pom.xml') != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        working-directory: services/ms-03-identity-auth
        run: mvn clean test

      - name: Verify Docker Build
        if: hashFiles('services/ms-03-identity-auth/Dockerfile') != ''
        working-directory: services/ms-03-identity-auth
        run: docker build -t roomiesmart-ms-03:ci-test .

  # Etapa 3 y 4: Publicación en AWS ECR (se activa al hacer merge a main)
  cd-push-ecr:
    name: Push Docker Image to AWS ECR
    needs: ci-build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Placeholder CD AWS ECR
        run: echo "Listo para conectar credenciales de AWS Academy Learner Lab y subir a ECR"